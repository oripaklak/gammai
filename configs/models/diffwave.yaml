# ==============================================================================
# DiffWave Model Configuration
# ==============================================================================
model:
  residual_layers: 36
  residual_channels: 800 # C
  dilation_cycle_length: 12 # note: residual_layers / dilation_cycle_length = number of repeating blocks
  unconditional: true
  signal_len: 16384

  # Diffusion Noise Schedual Parameters
  T: 200
  beta_init: 0.0001
  beta_final: 0.02 # if T = 200, change to 0.02

  # Fast Sampling Inference Parameters
  inference_noise_schedule: [0.0001, 0.001, 0.01, 0.05, 0.2, 0.5] # T_infer = 6