# ==============================================================================
# DiffWave Experiment Configuration
# ==============================================================================
experiment:
  project_name: "gammai-diff"

hardware:
  num_gpus: 2
  device_id: 0
  fp16: false

training:
  batch_size: 64
  epochs: 4000
  learning_rate: 0.0002
  seed: 40
  max_grad_norm: null
  checkpoint_freq: 5000 # steps
  print_freq: 60 # steps
  resume: false
  keep_last_n_checkpoints: 10
  use_pretrained_weights: true

generation:
  model_path: "checkpoints/diff_L36_C256_bs64_lr0.0002_ep2000/weights-55000.pt"
  num_samples_to_generate: 10
  fast_sampling: false
  num_tracking_steps: 10 # Set to 0 to disable tracking completely

tracking:
  wandb:
    enabled: true
    log_model_graph: true
    watch_log_freq: 10

paths:
  data_path: "data/spectrum_matrix_2023_2024.npy"
  scaling_factor_path: "data/scaling_factor_2023_2024.npy"
  pretrained_weights_path: "results/run_name/weights-100000.pt"
  checkpoints_dir: "checkpoints"