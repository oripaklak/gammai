# ==============================================================================
# DiffWave Experiment Configuration
# ==============================================================================
experiment:
  project_name: "gammai-diff"

hardware:
  num_gpus: 1
  device_id: 0
  fp16: false

training:
  batch_size: 64
  epochs: 1000
  learning_rate: 0.0002
  seed: 40
  max_grad_norm: null
  checkpoint_freq: 240 # steps
  print_freq: 60 # steps
  resume: false
  keep_last_n_checkpoints: 5

generation:
  model_path: "checkpoints/diff_bs16_lr0.0002_ep10000/weights-10800.pt"
  num_samples_to_generate: 100
  fast_sampling: false

tracking:
  wandb:
    enabled: true
    log_model_graph: true
    watch_log_freq: 10

paths:
  data_path: "data/spectrum_matrix.npy"
  scaling_factor_path: "data/scaling_factor.npy"
  checkpoints_dir: "checkpoints"