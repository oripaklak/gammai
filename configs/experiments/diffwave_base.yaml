# ==============================================================================
# DiffWave Experiment Configuration
# ==============================================================================
experiment:
  project_name: "gammai-diff"

hardware:
  num_gpus: 2
  device_id: 0
  fp16: false

training:
  batch_size: 16
  epochs: 1000
  learning_rate: 0.0002
  seed: 40
  max_grad_norm: null
  checkpoint_freq: 2000 # steps
  print_freq: 60 # steps
  keep_last_n_checkpoints: 10
  resume: true # Use for continuing crashed/stopped runs. Restores the entire state (weights, optimizer, scaler, step count)
  use_pretrained_weights: false # Use for fine-tuning. Loads ONLY the neural network weights

generation:
  model_path: "checkpoints/diff_7M_L36_C128_bs16_lr0.0002_ep1000/weights-22000.pt"
  num_samples_to_generate: 200
  fast_sampling: false
  num_tracking_steps: 10 # Set to 0 to disable tracking completely

tracking:
  wandb:
    enabled: true
    log_model_graph: true
    watch_log_freq: 10

paths:
  data_path: "data/spectrum_matrix_2023_2024.npy"
  scaling_factor_path: "data/scaling_factor_2023_2024.npy"
  pretrained_weights_path: "checkpoints/diff_200M_L36_C800_bs16_lr0.0002_ep400/weights-10000.pt"
  checkpoints_dir: "checkpoints"