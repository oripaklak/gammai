# ==============================================================================
# DiffWave Experiment Configuration
# ==============================================================================
experiment:
  project_name: "gammai-diff"

# ------------------------------------------------------------------------------
# Compressing Model (VAE) Settings
# ------------------------------------------------------------------------------
vae:
  enabled: true                                          # false = Raw signal space (DDPM), true = Latent space (LD-Diffusion)
  type: "kvae_audio"                                     # Routes to HF KVAEAudioCompressor ("hf", "kvae", or "diffusers")
  latent_dim: 2048                                       # Must match the trained VAE latent dimension
  checkpoint_path: "experiments/vae_ld2048_bs64_lr0.0001_ep10000/checkpoints/checkpoint_ep10000.pth" # Path to trained VAE checkpoint
  local_path: "models/pretrained/KVAE-Audio"

# ------------------------------------------------------------------------------
# Loss Strategy Settings
# ------------------------------------------------------------------------------
loss:
  use_nda: true         # Enable 1D Negative Data Augmentation (NDA)
  lambda_nda: 2         # Regularization weight (\lambda)
  eta: 100.0            # Stability constant (\eta) from Eq. 10/13


calibration:
  enabled: true
  num_params: 4
  conditioning_method: "film"         # Options: "concat", "film"
  film_location: "before_output_proj" # Options: "before_output_proj" or default: "after_output_proj"

hardware:
  num_gpus: 2
  device_id: 0
  fp16: false

training:
  batch_size: 16
  max_steps: 200000
  learning_rate: 0.0002
  seed: 40
  max_grad_norm: 1.0
  checkpoint_freq: 2000 
  print_freq: 100 
  keep_last_n_checkpoints: 10
  diffusion_loss_type: "l1"

  resume: false                 # Use for continuing crashed/stopped runs. Restores the entire state (weights, optimizer, scaler, step count)
  use_pretrained_weights: false # Use for fine-tuning. Loads ONLY the neural network weights

evaluation:
  eval_freq: 2000

generation:
  model_path: "experiments/stable_diff_ld2048_9M_IAEA_BAQ_L36C128_cosine0.01_bs16_lr2e-4_steps200k_film-pre_proj_nda0.01_s40/checkpoints/weights.pt"
  num_samples_to_generate: 200
  num_tracking_steps: 10
  fast_sampling: false
  detect_peaks: false
  min_prominence: 10

tracking:
  wandb:
    enabled: true
    log_model_graph: true
    watch_log_freq: 10

paths:
  base_dir: "data"
  dataset_name: "IAEA_BAQ"
  pretrained_weights_path: ""
  checkpoints_dir: "experiments"

metrics:
  f_mem_threshold: 0.5
